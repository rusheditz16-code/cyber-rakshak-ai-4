[project]
name = "cyber-rakshak-ai"
version = "1.0.0"
description = "Gujarati-language AI assistant for cyber-fraud awareness, scam checking and reporting for rural citizens (DDO Botad)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "edge-tts>=7.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
